services:
  mongodb:
    image: mongo:8.3
    networks:
      - english-internal
    volumes:
      - mongodb_data:/data/db
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  bot:
    image: english-bot:local
    build:
      context: .
      dockerfile: Dockerfile
    networks:
      - english-internal
      - traefik-public
    env_file:
      - .env
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - MONGODB_DB_NAME=english_bot
      - WEB_HOST=0.0.0.0
      - WEB_PORT=8000
    volumes:
      - bot_data:/app/data
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      labels:
        - traefik.enable=true
        - traefik.swarm.network=traefik-public
        - traefik.http.routers.english-bot.rule=Host(`wb.qper.link`)
        - traefik.http.routers.english-bot.entrypoints=websecure
        - traefik.http.routers.english-bot.tls.certresolver=letsencrypt
        - traefik.http.routers.english-bot.service=english-bot
        - traefik.http.services.english-bot.loadbalancer.server.port=8000

volumes:
  mongodb_data:
  bot_data:

networks:
  english-internal:
    driver: overlay
    attachable: true

  traefik-public:
    external: true
