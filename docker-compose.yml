x-bot-environment: &bot-environment
  BOT_TOKEN: ${BOT_TOKEN:?BOT_TOKEN is required}
  GEMINI_API_KEY: ${GEMINI_API_KEY:?GEMINI_API_KEY is required}
  GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
  GEMINI_MODELS_POOL: ${GEMINI_MODELS_POOL:-gemini-3.5-flash-lite,gemini-3.7-flash,gemini-3.6-flash,gemini-3.5-flash,gemini-3.1-flash-lite}
  MONGODB_URL: mongodb://mongodb:27017
  MONGODB_DB_NAME: ${MONGODB_DB_NAME:-english_bot}
  DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-UTC}
  TTS_VOICE: ${TTS_VOICE:-en-US-AriaNeural}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  WEBAPP_URL: ${WEBAPP_URL:-https://wb.qper.link}
  WEB_HOST: 0.0.0.0
  WEB_PORT: 8000
  JWT_SECRET: ${JWT_SECRET:-english_learning_bot_secret_jwt_key_2026}

services:
  mongodb:
    image: mongo:8.3
    networks:
      - english-internal
    volumes:
      - mongodb_data:/data/db
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  bot:
    image: english-bot:local
    build:
      context: .
      dockerfile: Dockerfile
    networks:
      - english-internal
      - traefik-public
    environment:
      <<: *bot-environment
    volumes:
      - bot_data:/app/data
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      labels:
        - traefik.enable=true
        - traefik.swarm.network=traefik-public
        - traefik.http.routers.english-bot.rule=Host(`wb.qper.link`)
        - traefik.http.routers.english-bot.entrypoints=websecure
        - traefik.http.routers.english-bot.tls.certresolver=letsencrypt
        - traefik.http.routers.english-bot.service=english-bot
        - traefik.http.services.english-bot.loadbalancer.server.port=8000

volumes:
  mongodb_data:
  bot_data:

networks:
  english-internal:
    driver: overlay
    attachable: true

  traefik-public:
    external: true
